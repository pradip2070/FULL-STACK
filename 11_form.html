<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>forms</title>
  </head>
  <body>
    <form action="">
      <input type="text" placeholder="enter your name" required />
     
      <br />
      <br />
      
      <input type="email" placeholder="enter your email" required />
      <br />
      <br />
      
      <input type="password" placeholder="enter your password" />
      <br />
      <br />

      <input type="date" />

      <br />
      <br />
      <input type="time" />

      <br />
      <br />

      <input type="tel" placeholder="phone number" />

      <br />
      <br />
      
      <input type="number" placeholder="number" />

      <br />
      <br />

      <input type="file" />

      <br />
      <br />

      <input type="checkbox" />

      <br />
      <br />

      <textarea
        name=""
        id=""
        rows="10"
        cols="10"
        placeholder="address"
      ></textarea>

      <br />
      <br />

      <label for="">yes</label><input type="radio" name="radio" /><label for=""
        >no</label
      ><input name="radio" type="radio" />

      <br />
      <br />

      <input type="range" />

      <br />
      <br />

      <input type="color" />
      <br />
      <br />

      <input type="search" />

      <br />
      <br />

      <input type="week" />

      <br />
      <br />

      <input type="datetime" />
      <br />
      <br />
      <input type="image" />

      <br />
      <br />
      <input type="hidden" />

      <br />
      <br />
      <input type="url" />

      <br>
      <br>

      <input type="link" placeholder="add your link">

      <br />
      <br />

      <select name="" id="">
        <option value="india">india</option>
        <option value="japan">japan</option>
        <option value="china">china</option>
        <option value="nepal">nepal</option>
      </select>

      <br />
      <br />

      <button type="reset">button</button>

      <br />
      <br />

      <button type="submit">submit</button>
    </form>
  </body>
</html>
