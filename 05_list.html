<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>list</title>
</head>
<body>
    <!--order list  -->

    <ol>
        <li>list-1</li>
        <li>list-2</li>
        <li>list-3</li>
        <li>list-4</li>
        <li>list-5</li>
    </ol>
    <!-- now with atributes -->
     <ol type="i">
        <li>list-1</li>
        <li>list-2</li>
        <li>list-3</li>
        <li>list-4</li>
        <li>list-5</li>

     </ol>

     <!-- un-order list -->
      <ul>
        <li>list-1</li>
        <li>list-2</li>
        <li>list-3</li>
        <li>list-4</li>
        <li>list-5</li>
      </ul>


      <!-- discription list -->
       <dl>
        <dt>vegetable</dt>
        <dd>potato</dd>
        <dd>onion</dd>
        <dd>cucumber</dd>
        <dd>garlic</dd>
        <dd>tomato</dd>
       </dl>
</body>
</html>
