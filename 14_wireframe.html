<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wireframe</title>

    <style>
        header {
            border: 1px double black;
            height: 100px;
        }

        .navbar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
        }

        li {
            list-style: none;
        }

        #Home,
        #about,
        #service,
        #help {
            height: 400px;
            border: 1px double black;
            margin-top: 10px;
            margin-bottom: 10px;
            text-align: center;
        }

        footer {
            height: 100px;
            border: 1px double black;
            margin-top: 10px;
            margin-bottom: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

    <header>
        <ul class="navbar">
            <li>Home</li>
            <li>About</li>
            <li>Service</li>
            <li>Help</li>
        </ul>
    </header>
    <main>
        <section id="Home">
            <h1>this is home section</h1>
        </section>

        <section id="about">
            <h1>this is about section</h1>
        </section>

        <section id="service">
            <h1>this is service section</h1>
        </section>


        <section id="help">
            <h1>this is help section</h1>
        </section>

    </main>

    <footer>
        <h1>this is footer section</h1>
    </footer>


</body>

</html>
